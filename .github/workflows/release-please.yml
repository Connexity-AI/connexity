name: Release Please

# Paused for the 2.0 rebuild: nothing is released until the rebuild ships as 2.0.0, and
# connexity-cli is frozen at 0.2.0. The push trigger is removed so no release pull
# request is opened or updated. See the decision log in REBUILD.md (2026-10-08).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
